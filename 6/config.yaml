db:
  uri: "mongodb://localhost:27017"
  database: "crawler_db"
  docs_collection: "docs"

corpus:
  max_docs: 2000

tokenizer:
  lowercase: true
  normalize_yo: true
  keep_numbers: true
  min_len: 2

zipf:
  max_docs: 2000

search:
  max_docs: 2000
  k1: 1.5
  b: 0.75
  top_k: 10
  use_stemming: true